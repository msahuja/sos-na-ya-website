<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North America YA Events</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
  :root{
    --ivory:#FAF6EF;
    --surface:#FFFFFF;
    --gold:#C08A2E;
    --gold-dim:#E7D3AC;
    --brown:#4A3728;
    --ink:#2B2118;
    --muted:#8B7355;
    --line:#EBE1CE;
    --today-glow: 0 0 0 3px rgba(192,138,46,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:20px;
    min-height:100vh;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap');

  .wrap{max-width:920px;margin:0 auto;}

  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
  }
  .header h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--brown);
  }
  .header .sub{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  .nav{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:16px;
  }
  .nav button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--brown);
    width:34px;height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav button:hover{background:var(--gold-dim);border-color:var(--gold);}
  .nav .month-label{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:500;
    color:var(--ink);
    min-width:170px;
    text-align:center;
  }
  .nav .today-btn{
    margin-left:auto;
    width:auto;
    border-radius:20px;
    padding:0 14px;
    height:32px;
    font-family:'Work Sans',sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
  }

  .grid{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .grid-head{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    background:#FBF8F2;
    border-bottom:1px solid var(--line);
  }
  .grid-head div{
    padding:10px 6px;
    text-align:center;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .grid-body{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .cell{
    min-height:92px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:6px 6px 8px;
    position:relative;
    cursor:default;
  }
  .cell:nth-child(7n){border-right:none;}
  .cell.outside{background:#FCFAF6;}
  .cell.outside .daynum{color:#D8CCB4;}
  .daynum{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    display:inline-flex;
    align-items:center;justify-content:center;
    width:22px;height:22px;
    border-radius:50%;
  }
  .cell.today .daynum{
    background:var(--gold);
    color:#fff;
    box-shadow:var(--today-glow);
  }
  .evt-dot-row{
    margin-top:5px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .evt-chip{
    font-size:10.5px;
    line-height:1.3;
    padding:2px 5px;
    border-radius:5px;
    background:var(--gold-dim);
    color:var(--brown);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
  }
  .evt-chip.allday{background:var(--brown);color:#fff;}
  .evt-chip:hover{background:var(--gold);color:#fff;}
  .more-chip{font-size:10px;color:var(--muted);padding-left:4px;}

  .upcoming{margin-top:28px;}
  .upcoming h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:17px;
    color:var(--brown);
    margin:0 0 12px;
  }
  .evt-row{
    display:flex;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .evt-row:last-child{border-bottom:none;}
  .evt-date{
    min-width:56px;
    text-align:center;
  }
  .evt-date .d{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--gold);line-height:1;}
  .evt-date .m{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);}
  .evt-info .title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;}
  .evt-info .time{font-size:12.5px;color:var(--muted);}

  .status{
    font-size:13px;
    color:var(--muted);
    padding:30px 0;
    text-align:center;
  }
  .status.error{color:#B54545;}
  .status a{color:var(--gold);}

  .footer-note{
    margin-top:18px;
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }

  @media (max-width:520px){
    .cell{min-height:64px;}
    .evt-chip{font-size:9.5px;}
    .nav .month-label{min-width:120px;font-size:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>North America YA Events</h1>
      <div class="sub">Science of Spirituality — Young Adults</div>
    </div>
  </div>

  <div class="nav">
    <button id="prevBtn" aria-label="Previous month">&#8249;</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextBtn" aria-label="Next month">&#8250;</button>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>

  <div class="grid">
    <div class="grid-head">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid-body" id="gridBody"></div>
  </div>

  <div id="statusArea"></div>

  <div class="upcoming" id="upcomingSection" style="display:none;">
    <h2>Upcoming</h2>
    <div id="upcomingList"></div>
  </div>

  <div class="footer-note">Synced from the SOS North America YA calendar</div>
</div>

<script>
/* ============================================================
   CONFIG — swap in your own ICS link and (if needed) proxy
   ============================================================ */
const ICS_URL = "https://outlook.office365.com/owa/calendar/532850cf59224f0d981998885d9a1fa1@sos.org/4a0bed0e434642bea8431bcc3a9677e315125753563851968528/calendar.ics";

// Outlook's published ICS feed typically does not send CORS headers,
// so a direct browser fetch from another origin will usually fail.
// This proxy re-serves the same bytes with Access-Control-Allow-Origin: *.
// It's fine for a low-traffic community calendar; swap for your own
// Cloudflare Worker / serverless proxy if you want more control.
const CORS_PROXY = "https://api.allorigins.win/raw?url=";

/* ============================================================ */

let events = [];
let viewDate = new Date();
viewDate.setDate(1);

const monthLabel = document.getElementById('monthLabel');
const gridBody = document.getElementById('gridBody');
const statusArea = document.getElementById('statusArea');
const upcomingSection = document.getElementById('upcomingSection');
const upcomingList = document.getElementById('upcomingList');

function setStatus(msg, isError){
  statusArea.innerHTML = msg ? `<div class="status${isError?' error':''}">${msg}</div>` : '';
}

async function loadCalendar(){
  setStatus('Loading events…');
  try{
    let text;
    try{
      const r = await fetch(ICS_URL, {mode:'cors'});
      if(!r.ok) throw new Error('direct fetch failed');
      text = await r.text();
    }catch(directErr){
      const r2 = await fetch(CORS_PROXY + encodeURIComponent(ICS_URL));
      if(!r2.ok) throw new Error('proxy fetch failed');
      text = await r2.text();
    }
    events = parseICS(text);
    setStatus('');
    render();
  }catch(err){
    setStatus('Could not load the calendar feed right now. <a href="'+ICS_URL+'" target="_blank" rel="noopener">Open the calendar directly</a>.', true);
  }
}

function parseICS(icsText){
  const jcalData = ICAL.parse(icsText);
  const comp = new ICAL.Component(jcalData);
  const vevents = comp.getAllSubcomponents('vevent');
  const parsed = [];

  vevents.forEach(vevent => {
    const event = new ICAL.Event(vevent);
    const isAllDay = event.startDate.isDate;

    const pushOccurrence = (start, end) => {
      parsed.push({
        title: event.summary || '(untitled)',
        location: event.location || '',
        allDay: isAllDay,
        start: start.toJSDate(),
        end: end ? end.toJSDate() : start.toJSDate()
      });
    };

    if(event.isRecurring()){
      const expand = new ICAL.RecurExpansion({
        component: vevent,
        dtstart: vevent.getFirstPropertyValue('dtstart')
      });
      const rangeStart = new Date();
      rangeStart.setMonth(rangeStart.getMonth() - 2);
      const rangeEnd = new Date();
      rangeEnd.setMonth(rangeEnd.getMonth() + 8);

      let next;
      let guard = 0;
      while((next = expand.next()) && guard < 500){
        guard++;
        const occStart = next.toJSDate();
        if(occStart > rangeEnd) break;
        if(occStart < rangeStart) continue;
        const dur = event.duration ? event.duration.toSeconds()*1000 : 0;
        const occEnd = new Date(occStart.getTime() + dur);
        pushOccurrence(next, { toJSDate: () => occEnd });
      }
    } else {
      pushOccurrence(event.startDate, event.endDate);
    }
  });

  return parsed;
}

function fmtMonth(d){
  return d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
}

function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function dateOnly(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

function eventOccursOnDay(e, cellDate){
  const day = dateOnly(cellDate);
  const startDay = dateOnly(e.start);
  let endDay = dateOnly(e.end);
  // All-day ICS events use an exclusive DTEND (the day after the last day)
  if(e.allDay && endDay > startDay) endDay -= 86400000;
  return day >= startDay && day <= endDay;
}

function render(){
  monthLabel.textContent = fmtMonth(viewDate);
  renderGrid();
  renderUpcoming();
}

function renderGrid(){
  gridBody.innerHTML = '';
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();

  const totalCells = Math.ceil((firstDow + daysInMonth) / 7) * 7;

  for(let i=0; i<totalCells; i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    let cellDate, dayNum, outside=false;

    if(i < firstDow){
      dayNum = daysInPrevMonth - firstDow + i + 1;
      cellDate = new Date(year, month-1, dayNum);
      outside = true;
    } else if(i >= firstDow + daysInMonth){
      dayNum = i - (firstDow + daysInMonth) + 1;
      cellDate = new Date(year, month+1, dayNum);
      outside = true;
    } else {
      dayNum = i - firstDow + 1;
      cellDate = new Date(year, month, dayNum);
    }

    if(outside) cell.classList.add('outside');
    if(sameDay(cellDate, today)) cell.classList.add('today');

    const dayEvents = events.filter(e => eventOccursOnDay(e, cellDate))
                             .sort((a,b) => a.start - b.start);

    let chipsHtml = '';
    const shown = dayEvents.slice(0,3);
    shown.forEach(e => {
      const isStartDay = sameDay(e.start, cellDate);
      const label = e.allDay ? e.title : (isStartDay ? `${e.start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} ${e.title}` : e.title);
      chipsHtml += `<div class="evt-chip${e.allDay?' allday':''}" title="${escapeHtml(e.title)}">${escapeHtml(label)}</div>`;
    });
    if(dayEvents.length > 3){
      chipsHtml += `<div class="more-chip">+${dayEvents.length-3} more</div>`;
    }

    cell.innerHTML = `<span class="daynum">${dayNum}</span><div class="evt-dot-row">${chipsHtml}</div>`;
    gridBody.appendChild(cell);
  }
}

function renderUpcoming(){
  const now = new Date();
  const upcoming = events
    .filter(e => e.start >= new Date(now.getFullYear(), now.getMonth(), now.getDate()))
    .sort((a,b) => a.start - b.start)
    .slice(0, 8);

  if(upcoming.length === 0){
    upcomingSection.style.display = 'none';
    return;
  }
  upcomingSection.style.display = 'block';
  upcomingList.innerHTML = upcoming.map(e => {
    const lastDay = e.allDay && dateOnly(e.end) > dateOnly(e.start)
      ? new Date(e.end.getTime() - 86400000)
      : e.end;
    const spansDays = !sameDay(e.start, lastDay);
    const d = spansDays ? `${e.start.getDate()}–${lastDay.getDate()}` : e.start.getDate();
    const m = e.start.toLocaleDateString('en-US',{month:'short'});
    const timeStr = e.allDay
      ? 'All day'
      : e.start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) + ' – ' + e.end.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return `<div class="evt-row">
      <div class="evt-date"><div class="d">${d}</div><div class="m">${m}</div></div>
      <div class="evt-info">
        <div class="title">${escapeHtml(e.title)}</div>
        <div class="time">${timeStr}${e.location ? ' · ' + escapeHtml(e.location) : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth()-1);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth()+1);
  render();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date();
  viewDate.setDate(1);
  render();
});

loadCalendar();
</script>
</body>
</html>
