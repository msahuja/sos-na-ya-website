<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — SOS YA Leadership Team</title>
<!--
  HOW TO UPDATE THIS PAGE
  ========================
  Everything on this page is generated from team-data.json — you never
  need to edit this HTML file to add, remove, or update a person.

  To edit someone's name, role, note, email, or phone:
    Open team-data.json and edit their entry. Leave "email" or "phone"
    as an empty string "" to show a "coming soon" placeholder instead.

  To add or change someone's headshot:
    Save a photo into the team-photos/ folder, named exactly after
    their "id" in team-data.json, e.g. team-photos/jay-ahuja.jpg
    (.jpg, .jpeg, .png, and .webp are all tried automatically).
    Until a photo is added, a colored initials circle is shown instead.

  To add a brand-new person:
    Add a new entry to the JSON array with a unique "id", matching the
    "section" name of an existing group (or a new section name to
    create a new group on the page).
-->
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse 900px 400px at 15% 0%, rgba(199,154,61,0.08), transparent 60%), #FAF8F3;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:#1C1A2E;
    padding:20px 0;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px;}

  .page-header{margin-bottom:28px;}
  .page-header .kicker{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    color:#A9791F; background:rgba(199,154,61,0.14); border-radius:999px;
    padding:5px 14px 5px 12px; margin-bottom:12px;
  }
  .page-header .kicker .dot{width:6px;height:6px;border-radius:50%;background:#A9791F;display:inline-block;}
  .page-header h1{
    font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:32px;
    margin:0 0 8px; color:#1C1A2E; letter-spacing:-0.01em;
  }
  .page-header p{font-size:15px; line-height:1.6; color:rgba(28,26,46,0.68); margin:0; max-width:640px;}

  .section{margin-bottom:22px;}
  .section h2{
    font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:17px;
    color:#1C1A2E; margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid rgba(28,26,46,0.1);
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:6px;}

  .card{
    background:#fff; border:1px solid rgba(28,26,46,0.07); border-radius:10px;
    padding:8px 10px; display:flex; flex-direction:row; align-items:center; text-align:left;
    gap:10px;
  }
  .avatar-wrap{width:38px; height:38px; position:relative; flex-shrink:0;}
  .avatar-wrap img{
    width:38px; height:38px; border-radius:50%; object-fit:cover;
    border:1px solid rgba(28,26,46,0.08); display:block;
  }
  .avatar-fallback{
    width:38px; height:38px; border-radius:50%; display:none; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:13px; color:#fff;
  }
  .info{min-width:0; flex:1;}
  .name-row{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .name{font-size:13px; font-weight:700; color:#1C1A2E; white-space:nowrap;}
  .note-badge{
    font-size:9px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    color:#5B4FC7; background:rgba(91,79,199,0.1); border-radius:999px; padding:1px 7px; white-space:nowrap;
  }
  .role{font-size:11px; color:rgba(28,26,46,0.6); line-height:1.3; margin:1px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .contact{font-size:10.5px; line-height:1.3; color:rgba(28,26,46,0.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .contact a{color:#5B4FC7; text-decoration:none; font-weight:600;}
  .contact a:hover{text-decoration:underline;}
  .contact .placeholder{color:rgba(28,26,46,0.35); font-style:italic;}

  .status{font-size:13px; color:rgba(28,26,46,0.5); padding:30px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <div class="kicker"><span class="dot"></span>Get In Touch</div>
    <h1>SOS YA Leadership Team</h1>
    <p>Have a question, idea, or just want to connect? Reach out to anyone on the team below — we'd love to hear from you.</p>
  </div>

  <div id="sections"></div>
  <div id="status" class="status">Loading team…</div>

</div>

<script>
const SECTION_ORDER = [
  "International YA Coordinator",
  "International YA Liaisons",
  "National Coordinators",
  "National Team",
  "Regional Coordinators"
];

const AVATAR_COLORS = ["#5B4FC7", "#A9791F", "#2E8B9A", "#C0607A", "#4A7D5F"];
const PHOTO_EXTENSIONS = ["jpg", "jpeg", "png", "webp"];

function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
}

function colorFor(id){
  let hash = 0;
  for(let i=0;i<id.length;i++) hash = (hash*31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

function personCard(p){
  const color = colorFor(p.id);
  const noteHtml = p.note ? `<span class="note-badge">${p.note}</span>` : '';

  let contactHtml;
  if(p.email && p.phone){
    contactHtml = `<a href="mailto:${p.email}">${p.email}</a> &middot; ${p.phone}`;
  } else if(p.email){
    contactHtml = `<a href="mailto:${p.email}">${p.email}</a>`;
  } else if(p.phone){
    contactHtml = p.phone;
  } else {
    contactHtml = `<span class="placeholder">Contact info coming soon</span>`;
  }

  return `
    <div class="card">
      <div class="avatar-wrap">
        <img src="team-photos/${p.id}.${PHOTO_EXTENSIONS[0]}" data-attempt="0" data-id="${p.id}"
             onerror="handlePhotoError(this)">
        <div class="avatar-fallback" style="background:${color};">${initials(p.name)}</div>
      </div>
      <div class="info">
        <div class="name-row"><span class="name">${p.name}</span>${noteHtml}</div>
        <div class="role">${p.role}</div>
        <div class="contact">${contactHtml}</div>
      </div>
    </div>
  `;
}

function handlePhotoError(img){
  const attempt = parseInt(img.dataset.attempt, 10) + 1;
  if(attempt < PHOTO_EXTENSIONS.length){
    img.dataset.attempt = attempt;
    img.src = `team-photos/${img.dataset.id}.${PHOTO_EXTENSIONS[attempt]}`;
  } else {
    img.style.display = 'none';
    img.nextElementSibling.style.display = 'flex';
  }
}

async function loadTeam(){
  const statusEl = document.getElementById('status');
  try{
    const res = await fetch('team-data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch failed');
    const people = await res.json();

    const bySection = {};
    people.forEach(p => {
      if(!bySection[p.section]) bySection[p.section] = [];
      bySection[p.section].push(p);
    });

    const sectionsEl = document.getElementById('sections');
    const orderedSections = [
      ...SECTION_ORDER.filter(s => bySection[s]),
      ...Object.keys(bySection).filter(s => !SECTION_ORDER.includes(s))
    ];

    sectionsEl.innerHTML = orderedSections.map(section => `
      <div class="section">
        <h2>${section}</h2>
        <div class="grid">${bySection[section].map(personCard).join('')}</div>
      </div>
    `).join('');

    statusEl.textContent = '';
  }catch(err){
    statusEl.textContent = 'Could not load the team list right now. Please try again shortly.';
  }
  sendHeight();
}

function sendHeight(){
  var h = document.body.scrollHeight;
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'contact-us-height', height: h }, '*');
  }
}
window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);
if (window.ResizeObserver) {
  new ResizeObserver(sendHeight).observe(document.body);
}

loadTeam();
</script>
</body>
</html>
